[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skellywix-harness-engine"
version = "0.1.0"
description = "Local, evidence-gated guide routing for agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
operator = ["jsonschema>=4.19,<5", "ruamel.yaml>=0.19.1,<0.20"]

[project.scripts]
skellywix = "skellywix.__main__:main"

[tool.setuptools]
packages = ["skellywix"]

[tool.setuptools.package-data]
skellywix = ["starter.json", "desk.css", "neural.html", "neural.css", "neural.js", "neural_scene.js", "operator.js", "operator.css", "pi_schemas.json"]
